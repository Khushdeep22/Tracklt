<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackIt - Smart Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-lg mt-10 h-fit">
        
        <!-- Header & Auth Buttons -->
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-2xl font-extrabold text-gray-800">TrackIt 🎓</h1>
            <button id="loginBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                Login / Sync
            </button>
            <button id="logoutBtn" class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                Logout
            </button>
        </div>
        
        <!-- Status Indicator -->
        <p id="statusText" class="text-xs text-gray-500 mb-6 font-medium">
            🟢 Guest Mode (Saving to this device only)
        </p>

        <!-- Add Subject -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="subjectInput" placeholder="Subject Name (e.g., DSA)" 
                   class="border border-gray-300 p-2 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="addSubject()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold transition">
                Add
            </button>
        </div>

        <!-- Subjects List -->
        <div id="subjectList" class="space-y-4">
            <!-- JavaScript se subjects yahan aayenge -->
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. Firebase Setup (Tumhari Keys)
        const firebaseConfig = {
            apiKey: "AIzaSyBsnuCs-4ofa6EvONcQv3u9f2AOa7Bc0Y0",
            authDomain: "trackit-eb85f.firebaseapp.com",
            projectId: "trackit-eb85f",
            storageBucket: "trackit-eb85f.firebasestorage.app",
            messagingSenderId: "372800781260",
            appId: "1:372800781260:web:7d4f68b0037233d7fa7b69"
        };

   firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        // State Variables
        let subjects = [];
        let currentUser = null;

        // UI Elements
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const statusText = document.getElementById("statusText");
        const subjectList = document.getElementById("subjectList");
        const subjectInput = document.getElementById("subjectInput");

        // 2. Authentication Logic
        loginBtn.addEventListener("click", () => auth.signInWithPopup(provider));
        logoutBtn.addEventListener("click", () => auth.signOut());

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loginBtn.classList.add("hidden");
                logoutBtn.classList.remove("hidden");
                statusText.innerHTML = `🔵 Cloud Sync On (${user.displayName})`;
                statusText.classList.replace("text-gray-500", "text-blue-600");
                loadData(); // Cloud se data load karo
            } else {
                currentUser = null;
                loginBtn.classList.remove("hidden");
                logoutBtn.classList.add("hidden");
                statusText.innerHTML = `🟢 Guest Mode (Saving locally)`;
                statusText.classList.replace("text-blue-600", "text-gray-500");
                loadData(); // LocalStorage se data load karo
            }
        });

        // 3. Core Logic
        function addSubject() {
            const name = subjectInput.value.trim();
            if (!name) return alert("Subject name cannot be empty!");

            subjects.push({ id: Date.now(), name: name, attended: 0, total: 0 });
            subjectInput.value = "";
            
            saveData();
            renderUI();
        }

        function markAttendance(index, status) {
            if (status === 'present') {
                subjects[index].attended++;
                subjects[index].total++;
            } else if (status === 'absent') {
                subjects[index].total++;
            } else if (status === 'undo' && subjects[index].total > 0) {
                // Ek class kam karo (galti se click hone par)
                if (subjects[index].attended > 0) subjects[index].attended--;
                subjects[index].total--;
            }
            
            saveData();
            renderUI();
        }

        function deleteSubject(index) {
            if(confirm("Are you sure you want to delete this subject?")) {
                subjects.splice(index, 1);
                saveData();
                renderUI();
            }
        }

        // 4. Data Saving & Loading (Smart Sync)
        function saveData() {
            if (currentUser) {
                // Cloud me save karo
                db.collection("users").doc(currentUser.uid).set({ attendanceData: subjects })
                  .catch(err => console.error("Error saving to cloud:", err));
            } else {
                // Local memory me save karo
                localStorage.setItem("trackit_guest_data", JSON.stringify(subjects));
            }
        }

        function loadData() {
            if (currentUser) {
                db.collection("users").doc(currentUser.uid).get().then((doc) => {
                    if (doc.exists && doc.data().attendanceData) {
                        subjects = doc.data().attendanceData;
                    } else {
                        // Agar cloud pe naya user hai, toh local data cloud me daal do (Migration)
                        let localData = JSON.parse(localStorage.getItem("trackit_guest_data"));
                        if (localData && localData.length > 0) {
                            subjects = localData;
                            saveData(); // Cloud me push kar diya
                        } else {
                            subjects = [];
                        }
                    }
                    renderUI();
                });
            } else {
                let localData = JSON.parse(localStorage.getItem("trackit_guest_data"));
                subjects = localData ? localData : [];
                renderUI();
            }
        }

        // 5. UI Rendering
        function renderUI() {
            subjectList.innerHTML = "";
            
            if (subjects.length === 0) {
                subjectList.innerHTML = `<p class="text-center text-gray-400 text-sm mt-4">No subjects added yet.</p>`;
                return;
            }

            subjects.forEach((sub, index) => {
                let percent = sub.total === 0 ? 0 : Math.round((sub.attended / sub.total) * 100);
                
                // Color coding for percentage
                let colorClass = percent >= 75 ? "text-green-600" : percent >= 60 ? "text-yellow-600" : "text-red-600";

                subjectList.innerHTML += `
                    <div class="border border-gray-200 rounded-lg p-4 bg-gray-50 shadow-sm relative">
                        <button onclick="deleteSubject(${index})" class="absolute top-2 right-2 text-gray-400 hover:text-red-500 text-lg leading-none">&times;</button>
                        
                        <div class="flex justify-between items-end mb-3">
                            <div>
                                <h3 class="font-bold text-lg text-gray-800">${sub.name}</h3>
                                <p class="text-xs text-gray-500">Attended: ${sub.attended} / ${sub.total}</p>
                            </div>
                            <div class="text-2xl font-black ${colorClass}">${percent}%</div>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="markAttendance(${index}, 'present')" class="bg-green-100 hover:bg-green-200 text-green-700 py-1 rounded font-semibold text-sm">✅ Present</button>
                            <button onclick="markAttendance(${index}, 'absent')" class="bg-red-100 hover:bg-red-200 text-red-700 py-1 rounded font-semibold text-sm">❌ Absent</button>
                            <button onclick="markAttendance(${index}, 'undo')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 rounded font-semibold text-sm">↩️ Undo</button>
                        </div>
                    </div>
                `;
            });
        }

        // Jab page pehli baar load ho (Firebase auth check karne se pehle UI dikhane ke liye)
        renderUI();
    </script>
</body>
</html>
